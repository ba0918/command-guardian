name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLISHED_TARGET: x86_64-unknown-linux-musl

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --cwd plugins/opencode
      - run: cargo clippy --workspace --all-targets --locked --target "$TARGET" -- -D warnings
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo test --workspace --all-targets --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: bun run --cwd plugins/opencode typecheck
      - run: bun run --cwd plugins/opencode test:unit
      - name: Verify native OpenCode integration and archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export OPENCODE_TEST_BIN="$PWD/plugins/opencode/node_modules/@opencode/cli-linux-x64/bin/opencode"
          test "$("$OPENCODE_TEST_BIN" --version)" = "opencode v2.0.21"
          export GUARDIAN_TEST_BIN="$PWD/target/$TARGET/release/command-guardian"
          bun run --cwd plugins/opencode test:integration
          scripts/package-release.sh "$GUARDIAN_TEST_BIN" "$TARGET" "$RUNNER_TEMP/package"
          mkdir "$RUNNER_TEMP/extracted" "$RUNNER_TEMP/bridge"
          tar -xzf "$RUNNER_TEMP/package/"*.tar.gz -C "$RUNNER_TEMP/extracted"
          cp "$OPENCODE_TEST_BIN" "$RUNNER_TEMP/opencode-test"
          export OPENCODE_TEST_BIN="$RUNNER_TEMP/opencode-test"
          bun build plugins/opencode/tests/integration/bridge/index.ts --target=node --format=esm --reject-unresolved --env=disable --outfile="$RUNNER_TEMP/bridge/server.js"
          echo '{"type":"module"}' > "$RUNNER_TEMP/bridge/package.json"
          export GUARDIAN_TEST_BIN="$RUNNER_TEMP/extracted/command-guardian"
          export GUARDIAN_PLUGIN_DIR="$RUNNER_TEMP/extracted/opencode"
          export GUARDIAN_TEST_BRIDGE_DIR="$RUNNER_TEMP/bridge"
          bun run --cwd plugins/opencode test:integration

  changes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install kotowari 0.3.0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kotowari.tar.gz" https://github.com/ba0918/kotowari/releases/download/kotowari-v0.3.0/kotowari-v0.3.0-x86_64-unknown-linux-gnu.tar.gz
          echo "e1075253b380ae8978a01eb17dcd4f4a6704a0574a813a93f8063c1033e1dc4d  $RUNNER_TEMP/kotowari.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kotowari.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotowari-v0.3.0-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Check IR
        run: kotowari check --format json

  release:
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          heading=$(grep -E "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || true)
          test -n "$heading" || { echo "日付入りCHANGELOGがないため公開しません"; exit 0; }
          grep -qF "[$version]: https://github.com/$GITHUB_REPOSITORY/compare/" CHANGELOG.md
          grep -F "[$version]: " CHANGELOG.md | grep -qF "...v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > "$RUNNER_TEMP/tag.json" 2> "$RUNNER_TEMP/tag-error"; then
            echo "公開済みタグは変更しません"
            exit 0
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/tag-error" || { cat "$RUNNER_TEMP/tag-error" >&2; exit 1; }
          awk -v heading="$heading" '
            $0 == heading { found = 1; next }
            found && /^## |^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"
          echo "release=true" >> "$GITHUB_OUTPUT"
      - if: steps.decide.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.PUBLISHED_TARGET }}
      - if: steps.decide.outputs.release == 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: steps.decide.outputs.release == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Build and package
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build release archive
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          cargo build --release --locked --target "$PUBLISHED_TARGET"
          binary="target/$PUBLISHED_TARGET/release/command-guardian"
          "$binary" --help
          bun install --frozen-lockfile --cwd plugins/opencode
          scripts/package-release.sh "$binary" "$PUBLISHED_TARGET" .
      - name: Create tag and release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          archive="command-guardian-v$VERSION-$PUBLISHED_TARGET.tar.gz"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
            -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"
          gh release create "v$VERSION" "$archive" "$archive.sha256" \
            --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/published" --pattern "$archive" --pattern "$archive.sha256"
          cmp "$archive.sha256" "$RUNNER_TEMP/published/$archive.sha256"
          cd "$RUNNER_TEMP/published"
          sha256sum -c "$archive.sha256"
