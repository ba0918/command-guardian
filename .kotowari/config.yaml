ir: docs/ir
decisions:
  records: docs/decision/records
  adr: docs/decision/adr
changes:
  files:
    - "src/**/*.rs"
    - "crates/**/src/**/*.rs"
    - "tests/**/*.rs"
    - "crates/**/tests/**/*.rs"
    - "Cargo.toml"
    - "crates/**/Cargo.toml"
    - "scripts/**/*"
    - "lefthook.yml"
    - ".github/workflows/**/*"
    - ".githooks/**/*"
    - "AGENTS.md"
    - "PROJECT.md"
    - ".gitignore"
    - ".ignore"
  exclude:
    - "Cargo.lock"
  records:
    - ".kotowari/changes/implementation.yaml"
    - ".kotowari/changes/review.yaml"
tests:
  files:
    - "src/**/*.rs"
    - "tests/**/*.rs"
    - "crates/**/src/**/*.rs"
    - "crates/**/tests/**/*.rs"
  rust:
    attributes: []
    macros: []
  rules: []
guides:
  files: []
surface:
  files: []
  rules: []
limits:
  lines: 200
  requirements: 10
vague_words:
  - "適切に"
  - "必要に応じて"
  - "通常は"
  - "など"
