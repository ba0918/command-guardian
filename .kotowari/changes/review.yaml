  reason: >-
    比較基準にはmode.defer_askもREQ-059〜REQ-064も無く、REQ-022はフックのaskを常にaskとして返していた。利用者が決定A1〜A17を採り、実装担当が委ねられた範囲でA18（6番目の欄deferred）とA19（OpenCode用のstatus deferredの形）を決めたため新しい選択である。 layers.rsはプロジェクト層のmode.defer_askを型の検証前に取り除いて警告し、利用者層ではread_boolの警告によってファイル全体が不採用になる（REQ-059、REQ-013〜REQ-015、A3、A15）。試験でtrue・不正値・信頼済みプロジェクトの各場合を確かめた。 hook.rsは影実行の分岐の後、最終判定がaskの場合だけ何も出力せず終了コード0で返して委任を記録し、blockと助言のblockは従来どおり（REQ-060、REQ-062、REQ-063、A1、A2、A7、A8、A11）。checkの経路と入力を読めない場合は変えていない（REQ-018、REQ-023、A4、A16、EX-121、EX-132）。 opencode.rsは同じ条件で{status:deferred, mode.enforce:true, reason}を返し、記録に失敗すればwarningを足す（REQ-061、A12、A17、A19）。log.rsは影ログと同じ保存先と検査で6番目の欄deferredを足し、影実行の行は5欄のまま（REQ-062、A18）。 既存試験の期待は変えておらず、追加した試験の期待はEX-114〜EX-132と一致する。
