    他の.rsは整形とimport順だけの差である。use文の識別子集合は全ファイルで前後一致した。
    let chainsの書換え(effects.rsの最終段の状態合流、置換本体の走査、find -exec rm、相対削除元、
    classify.rsのホームとcwdの保護、git.rsのgit status終了処理、parserの引用除去、
    config.rsの一時領域既定、evaluation.rsのblock理由、guard.rsのオプション値照合、
    worker.rsの文脈キャッシュ、log.rsのdebug_text、hook.rsの判定しないhook入力)は、
    いずれも元の入れ子にelse分岐がなく、条件の評価順と短絡も同じである。
    guard.rsのelse if側もelseを持たず、format!の一時値はstrip_prefixの結果の借用元ではない。
    束縛(child、engine、state、status)の寿命は元のブロック終端と実質同じで、後続処理はない。
    guards_flags.rsはREQ-031の試験でset_varとremove_varをunsafeで囲んだだけで、
    guardian-policyのsrcと同試験ファイルが環境変数を読まないことをrgで確認した。
    試験の期待値、試験名、@kotowari印の変更はない。各Cargo.tomlはeditionの2021から2024への変更だけである。
    以上から挙げた要求の意味は変わらない。gitの起動と期限(REQ-020)にも触れるため追加した。
    残る不確実性として、cargoの試験とビルドは呼出元の実行結果に依拠し、自分では実行していない。
