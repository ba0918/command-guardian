    sha256: sha256:fb2bddcc63ba9e84ff80e9ec6aca3a7c2043aff7b377b4dfc094fcd014ada66e
  conclusion: new
  reason: >-
    利用者の決定A4により版の表示とOpenCode連携の残件を0.3.1として配布する。正本のCargo.tomlの[package].versionは0.3.0から0.3.1になり、Cargo.lockの自パッケージの版も一致する。ワークスペースの他のクレートとプラグインのpackage.jsonは自身の版を持たない。
    CHANGELOGの見出し"## [0.3.1] - 2026-10-04"は正本と一致し、v0.3.0...v0.3.1の比較リンクがあり、Unreleasedは空で残る。CIの見出しと比較リンクの検査の形にも合う。3つの項目はそれぞれ--versionと-V(REQ-071)、明示した接続の確かめ直し(REQ-065)、委ねる要求への拒否の返答の廃止(REQ-067、A9の範囲)を、導入済みの利用者に見える違いとして単独で読める形で正しく述べる。
    README.mdとdocs/opencode.mdの導入例、置き換えの案内、束の名前、リリースのリンク、設定例はv0.3.1に揃い、残る0.3.0は「0.3.0から」の履歴の記述だけである。docs/opencode.mdの確かめ直しの説明はA5とREQ-065と一致する。
    FLAG-002は仕様の出典の欠落で、A8により内容を変えずにREQ-057、EX-106、EX-088の出典を正し、フラグを除いたので修正済みとする。REQ-052とREQ-056の意味は変わっていない。
