    sha256: sha256:08e0a91764e937241e01001ca9188f2ed43510a67259f85ff87ade64cdaf2e88
  conclusion: new
  reason: >-
    比較元には版を表示する入口が無く、仕様の欠落にあたる。利用者が決めたA1〜A3に基づきREQ-071、EX-154、EX-155が加わり、REQ-045にトップレベルの版の案内が足された。
    src/main.rsは最初の引数が"--version"か"-V"のときだけ、設定読込と標準入力の読取の前にCARGO_PKG_VERSIONを使って"command-guardian <版>"の1行を出し0で終わる。checkとhookの後ろは各入口へ渡るままでA2と一致する。
    ヘルプのOptionsとExit codesの追記はA3とREQ-045の範囲内である。
    試験はEX-154(壊れた設定と開いた標準入力でもCargo.tomlの版と完全一致の1行と0)、EX-155(hookの後ろでは版を出さずhookとして判定する)、check --versionが版を出さないこと、ヘルプが--versionと-Vを含むことを確かめる。
    既存の試験は待ちの検査を補助関数へ移しただけで期待を弱めていない。cargo test --test language_helpは13件成功し、リリースビルドの--versionと-Vは"command-guardian 0.3.1"を出した。
  requirements: [REQ-045, REQ-071]
