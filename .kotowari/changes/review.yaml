    reason: >-
      Independently reviewed base 21d443baf7c97a55c3a8799963d2423ccab07a88 against candidate 48185b5fa9d6840a0640f015cb17ca43b822d8b4 and computed mode-plus-blob hashes directly from those Git snapshots.
      Of the eight changed paths only the workflow, .gitignore and PROJECT.md match the configured change globs; site/ and the decision record are outside them. No src, crates, tests, Cargo.toml, Cargo.lock or docs/ir path changes, so product behavior, IR and external contracts are untouched.
      The Pages workflow grants only contents read at top level, checks out without persisted credentials, and grants pages write and id-token write only to the deploy job. Upload and deploy are both gated on a non pull_request event, so PRs touching site/ or the workflow build without publishing; push to main and manual dispatch deploy.
      After cargo build --release --locked, python3 site/build.py --out to a scratch directory outside the repository exited 0 with no demo warnings, all eight demos returned their expected allow, ask or block verdicts from the real binary, the hook demo printed JSON, no placeholder was left unresolved, and the output referenced no external script, stylesheet or font.
      The decision record A1 to A3 and the new PROJECT.md section match this behavior: Cargo.toml version, CHANGELOG entries and README headings and tables are read at build time, missing headings fail the build, verdict mismatches only warn, and _site/ is the ignored default output.
      Non-blocking observations: the PR path filter omits README.md, README-ja.md, CHANGELOG.md and Cargo.toml, so a README heading rename that breaks the page build is first detected on main; the fixture is written under target/site-demo inside the repository; workflow_dispatch from a non-main ref would deploy unless the github-pages environment restricts branches; Pages must be enabled with the GitHub Actions source in repository settings, which is outside the code.
      No blocking finding was found. Integration checks on the final HEAD remain the caller's responsibility.
