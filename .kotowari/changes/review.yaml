  reason: >-
    比較基準ではREQ-052（決定2026-10-02-opencode-v2-hook.mdのA15）が承認要求を作れなければ実行しないと定めていた。REQ-067はこれを警告してOpenCodeに委ねる扱いに改め、利用者が決定A23、A24、A27〜A29で採ったため新しい選択である。 approval.tsは承認待ちを作成の応答の受信から始め、作成の失敗・応答不明では"unavailable"を返し、先に届いた拒否は守り（A28）、作成中に通信が切れた後にaskの応答が届けば取りやめ（A27）、通信が終わった後の要求では接続し直してから作成し、つなぎ直せなければ"unavailable"にする（A29）。承認待ち中の切断・中断・解除による取りやめと再開しない扱い（REQ-053、REQ-054）は保っている。 試験req_052_creation_failure_is_not_approvalの期待（拒否で止まる）をreq_067の"unavailable"へ変えたのは、REQ-067とEX-147への改定に当たる。req_053の試験に1ティックの待ちを足したのは、待ちの開始を作成の応答の後と定めたREQ-067に合わせたもので、切断で取りやめる期待そのものは変わっていない。追加の試験EX-149〜EX-153は要求の文言どおりである。
