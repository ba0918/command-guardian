  - path: docs/ir/opencode-standalone.md
    sha256: sha256:f851d4a039bf4038f90243fce5035eac6640879cb81c0e62772208f8088ff1cb
  - path: docs/ir/opencode.md
    sha256: sha256:fb2bddcc63ba9e84ff80e9ec6aca3a7c2043aff7b377b4dfc094fcd014ada66e
  conclusion: new
  reason: >-
    比較元のREQ-065は明示した接続の失敗時に警告して接続なしとして扱うことだけを定め、確かめ直しは定めていなかった。利用者が決めたA5に基づき、REQ-065に実行ごとの1秒の確かめ直しとREQ-050〜REQ-052の承認の経路への復帰が加わり、EX-156が加わった。
    index.tsは接続の種類がfailedのときだけ実行の前にconnectを呼び直し(connection.tsの1秒の打ち切りを使う)、同時の実行は1つの確かめ直しを共有し、つながればその実行からApprovalを作って通常の経路を使う。つながらなければ従来どおりmisconfiguredの警告を出してOpenCodeに委ねる。
    確かめ直しの後の解除と取り消しの確認は、既存の各await後の確認と同じ扱いをまとめたもので、新しい意味は足していない。解除後に確かめ直しが終わってもApprovalは作られない。
    試験はEX-156(読み込み時に届かない宛先が中継でつながると承認要求が出て返答まで起動しない)と、確かめ直し中に解除するとblockのコマンドが起動しないこと(REQ-065)を確かめる。setup試験の宿主の代役はhookの解除で登録を外すよう実際の宿主に合わせただけである。
    単体試験50件、OpenCode 2.0.21の統合試験27件、typecheckが成功した。
  requirements: [REQ-050, REQ-051, REQ-052, REQ-065]
  decisions:
