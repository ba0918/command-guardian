  conclusion: new
  reason: >-
    独立したCode/Documentのstandard照合で、候補全体と両IR、旧A10の更新、
    新しいA2・A3の理由と判断者を確認した。手動接続だけだった要求の変更は、
    呼出元が示した利用者承認済みの自動接続と探索前検証の範囲に収まる。
    新経路は登録を一度だけ読み、自身のPID、文字列のURLと非空の認証情報、
    loopback HTTPを通信前に検証する。認証付きSDK接続の宛先を固定し、
    サーバー応答のPIDと2.0.21を照合する。SDKの固定版ソースでも注入fetchが
    情報取得と後続要求に使われることを確認し、redirect:errorが継続して適用される。
    discoverの検証前通信と登録再読込は製品経路から除かれている。
    明示オプションが一つでもあれば登録を読まず従来経路だけを使うため、
    不完全な設定や認証失敗を自動接続で隠さない。接続を確定できない場合は
    shellを不明として承認経路へ進み、その経路がなければ実行せず失敗を返す。
    確定済み影実行の既存優先順位、native権限、実行単位の承認、中断後の未再開、
    起動入力との対応付けは変更されていない。
    追加検証の条件は利用者の登録設定、登録差替え、HTTP応答、明示設定不備から
    生じ得るもので、製品の接続・実行を対象としREQ-052とEX-106からEX-110に対応する。
    隔離連携試験はモデルを呼ばず、接続なしのallow・block・native承認と
    EX-109の未実行を実ホストで確認する構成である。
    導入説明は0.1.2と未公開機能を区別し、同版の本体とpluginの登録、Bash条件、
    手動接続の例外、未検証環境と保証の限界を維持する。仕様にない新しい製品規則、
    個人設定の変更、別サービス起動、認証情報の書出しは認められなかった。
    独立実行した型検査、書込みのない純粋関数3試験、transportとreadFileを置換した
    接続検査は成功した。接続検査では不正登録の通信0件、登録差替え後も固定した宛先、
    redirect:error、一呼出し一読込、応答PID・版の不一致拒否、明示不備時の探索不使用を観測した。
    書込み制限により一時ファイルを作るunit試験と連携試験は再実行しておらず、
    実装者の24unit・12integrationという実行件数を独立観測とは扱わない。
    各ファイルのmode込みhashと両IRのhashは比較元とworking bytesから独立に再計算した。
    この記録は凍結working bytesの適合判断であり、統合の最終changes検査は
    呼出元が両記録をコミットして候補HEADを確定した後に行う必要がある。
