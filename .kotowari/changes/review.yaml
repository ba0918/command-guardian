  conclusion: new
  reason: >-
    基準の時点のIRでは、接続や認証の失敗と承認要求を作れない場合は実行しない(当時のREQ-052、EX-089、EX-109)、自動接続は版2.0.21の相手だけを採用し、実行ごとに版を照合していた。今回の実装はこれらを外し、基準のIRの内側には収まらないため新しい判断として扱う。根拠はすべて利用者が決めた2026-10-04-opencode-standalone.mdの決定で、同じ比較範囲でIR(REQ-065〜REQ-067、REQ-070と改訂したREQ-047、REQ-049〜REQ-052、REQ-055、CONTEXTのask)に反映済みである。
    index.tsは読み込み時にrequiredApisの5つの名前を確かめて欠けた名前で失敗し(A20、EX-145)、ctx.app.versionの照合を消した(A16、EX-144)。connection.tsは結果を接続済み・なし・明示設定の失敗に分け、自動接続の版照合を消し(A17、EX-106)、明示設定はserver.infoで確かめて失敗しても自動接続へ切り替えない(A22)。接続が無いときはtool.executeで判定せず、create.beforeの実際のshell・cwd・コマンドで判定し、blockだけを拒否してそれ以外と起動入力を確定できない場合は何もせず戻る(A2、A4、A21、REQ-065、REQ-066)。明示設定の失敗は読み込み時1回と実行ごと1回console.warnする(A25)。
    approval.tsはイベントの通信を接続ごとに分け、承認待ちを作成の応答の受領から始め(A24)、作成失敗や応答なしはunavailableとして呼び出し側が毎回警告して委ねる(A23、A25)。作成前の拒否の保持(A28)、作成中に作成時の接続が切れた後のaskの取りやめ(A27)、通信終了後のつなぎ直しと失敗時の委任(A29)を実装し、承認待ち後の切断・中断・解除の取りやめは保った(REQ-053)。
    試験の期待の変更は、旧EX-089・EX-109の停止を警告と委任に改めたもの、作成失敗をunavailableとしたもの(REQ-067、EX-147)、承認待ちの切断の試験を作成の応答の後に切るよう同期したもの(EX-148)で、いずれも改訂後のIRと一致する。削除された要求IDつきの試験は無く、既存の同一性・リダイレクト・未認証の試験は残る。単体試験44件の成功を確かめた。結合試験は実行していない。
    範囲外の観察(info、遮断しない): 応答の不明な作成の後始末のrejectが同じセッションの他の保留要求をまとめて拒否しうること、ex_153が再接続の回数を固定していること、明示設定の読み込み時の1秒の確認が一時的に失敗するとそのセッションの間は接続なしで動くこと(A22の範囲内)。
  requirements: [REQ-047, REQ-049, REQ-050, REQ-051, REQ-052, REQ-053, REQ-055, REQ-065, REQ-066, REQ-067, REQ-070]
