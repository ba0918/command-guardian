    reason: >-
      Independently reviewed the caller-fixed comparison from
      cf2117167ff42533c647b86e50426df6eef5adaa to
      d025e29b52684bc6edbc14c72d64be7b8a952b43. These changes establish a new
      repository development procedure rather than implement an existing product
      requirement. The configured coverage includes the current product sources,
      tests, manifests and verification scripts, with hooks and future CI paths
      selected and the generated Cargo.lock exclusion explicitly justified by A1.
      The exploration ignore does not remove records from Git validation.
      PROJECT.md requires caller-selected branch-wide snapshots, independently
      authored role records and integration checks, without adding changes to
      pre-commit or publishing CI. AGENTS.md limits grounded IR additions to
      approved scope and prohibits changing approved requirements or adopting
      unsupported meaning. The complete comparison contains no product source,
      test or IR changes, so no product requirement or definition IR is needed;
      the implementer entry also names no IR. A1 through A3 support this local
      adoption without ratifying earlier implementation.
