    比較基準ではREQ-049・REQ-050がguardianのaskに常に承認要求を出すと定め、プラグインは"deferred"の応答を無効として承認を求めていた。REQ-061と決定A5、A12、A17、A19で委任の応答を受けたときだけ承認要求を省くことにしたため新しい選択である。 gate.tsはstatusがdeferredでmode.enforceがtrue、verdictが無く、warningが無いか文字列のときだけ委任とし、warningは標準エラーに示すだけで実行に進む。それ以外のdeferredは無効な応答として承認を求める（A19、REQ-051）。プラグインは設定を読まない（REQ-048）。 判定結果を取得できない場合（バイナリ未検出）は委任せず理由付きで承認に回すことをguardian.test.tsで確かめた（REQ-051、A14、EX-125）。既存試験の期待は変えていない。
