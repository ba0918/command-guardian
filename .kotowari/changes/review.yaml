    reason: >-
      呼出元が確定した比較元と現在の候補について、全対象のGit mode・blobと関連IRのidentityを独立に再計算した。
      REQ-025のCIビルド・試験とLinux x86_64配布を実現する運用設定であり、製品コード・試験・IRの意味は変更しない。
      PR実headとmerge-base、push before/after、両Rustターゲット、独立記録の照合、pre-pushのstdinと比較元を確認した。
      CI公開・自動リリース・pre-pushへの適用は利用者が明示承認した範囲であり、新しい製品要求としてIRに追加しない。
      リリースは検査したSHAにタグをcreate-onlyで作成し、競合する既存タグでは停止して再利用しない。
      今回の通信FD3・4・5のcloseはhookの子shellだけに作用し、Git親プロセスや標準入出力を変更しない。
      低FD上限で動的リンクが失敗する呼出元の診断に対応し、試験を弱めず通常の子プロセス環境へ戻す運用修正である。
      利用者が初回0.1.0公開を承認した。英語CHANGELOGの日付入り見出しとCargoの正本版、実rootからの比較リンク、抽出される非空の公開文を照合した。
      actionlint、lefthook validate、shell構文を本担当が確認した。GNU・musl全検査と実push hookでの該当CLI試験成功は呼出元の報告であり、修正後の全検査は最終候補で再確認する。
      公開とmise導入は本担当では未実行である。最終commitのreview段階changesは呼出元に残る。
    requirements: [REQ-025]
