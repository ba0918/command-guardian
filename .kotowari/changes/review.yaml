    reason: >-
      REQ-058 requires isolated model-free integration verification. Independent
      candidate runs from two Git-exported source trees without an artifacts
      directory passed all nine existing native tests using GNU and musl binaries;
      both extracted bundles passed the same suite. No fixture roots remained.
      Source review confirms diagnostics directory creation precedes the write,
      and finally attempts fixture removal even when diagnostics handling rejects.
      This repairs the verification lifecycle within the approved S4/S5 scope.
      The patch leaves host registration, authentication, isolation, redaction and
      behavioral assertions intact, and introduces no new product meaning or
      specification gap. Diagnostic error-path cleanup was reviewed statically,
      not fault-injected. The diagnostic path is not treated as a public contract.
