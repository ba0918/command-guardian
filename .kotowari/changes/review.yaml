  reason: >-
    基準の時点のREQ-057は版2.0.21を検証基準として導入手順に明記することを求め、導入手順はstandaloneに明示の接続設定を案内し、接続や認証の失敗では実行しないと説明していた。今回の文書の変更はこれらを改めるもので、基準のIRの内側には収まらないため新しい判断として扱う。根拠は利用者が決めたA5、A8、A9、A16、A18〜A23、A25、A27〜A29で、REQ-057・REQ-058の改訂とREQ-068〜REQ-070として同じ比較範囲のIRに反映済みである。
    docs/opencode.mdは版を対応条件から外し、プラグインが頼る5つのAPIを列挙し(index.tsのrequiredApisと一致)、読み込み失敗後と他のプラグインのevaluateによる上書きを保証しないと書く(REQ-057、REQ-070、A5、A20)。standaloneは接続設定なしで動き、接続が無いときはblockだけを拒否し承認が要る実行はguardianの確認なしにOpenCodeに委ねること、明示設定の失敗の警告(読み込み時と実行ごと)、standaloneに明示設定を使わないことを書く(REQ-065、REQ-066、REQ-068)。承認の節は作成失敗の委任、先に届いた拒否の保持、作成中の切断後の取りやめ、つなぎ直し、承認待ちが作成の応答から始まることを書き(REQ-067、REQ-053)、検証の範囲はserve --stdioの結合試験と通し実行を必須にしないことを書く(REQ-058、REQ-069)。いずれも実装と一致する。READMEは版の記載を外し参照先を足し、CHANGELOGはUnreleasedだけに足した。
    README-ja.md、site/template.html(A30)、決定記録とIRは変更照合の対象の外で、ここでは判断していない。
