    conclusion: existing
    reason: >-
      Independent whole-branch comparison finds the added OpenCode path implements
      the approved shell-tool contract without changing check or the Claude/Codex
      response branches. The Rust entry reuses the existing engine and shadow log;
      its explicit unavailable/shadow distinction supports the approved failure and
      confirmed-shadow priorities. The adapter retains the original executor,
      snapshots its input, resolves cwd lexically, and compares host shell input in
      the same asynchronous execution context. The former host-valid empty-command
      rejection is removed from both shared conversion callers; Rust unavailable
      now reaches native approval rather than an adapter input error. Remaining
      conversion guards have no established producer under the pinned native input
      schema, absolute location contract, and supported explicit Bash conditions.
      Approval evaluation preserves native deny while preventing saved allow from
      skipping a fresh request. Request/session identity and terminal cancellation
      checks prevent a reply from authorizing another or cancelled execution; stream
      loss and unload end pending waits without a new approval deadline or history.
      Host-derived executor fixtures cover real registration, native permissions,
      preserved inputs, once/reject responses, concurrency and RPC cancellation,
      rather than using test marks as proof of those behaviors. Model-driven active
      session interruption and auto execution remain unobserved; pinned upstream
      source and the documented limits do not claim those trials occurred. The
      release script bundles current TypeScript and declared runtime dependencies,
      derives the manifest version from Cargo.toml and carries license notices;
      CI also exercises the extracted bundle. Installation remains manual and
      same-server authentication explicit. These representations, dependency pins
      and modules stay within D1; they add no unsupported consequential meaning or
      approved-requirement change. No specification gap remains in this comparison.
