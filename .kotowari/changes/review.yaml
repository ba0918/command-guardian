  reason: "本体はenforceかつdefersのときだけstatus deferred、mode.enforce true、reasonを返しverdictを持たず、記録失敗時はwarningを足し標準エラーにも警告する（REQ-061、EX-123、EX-131）。enforce=falseでは従来のshadow応答と5欄の記録のまま（REQ-063、REQ-048）。プラグインのresponseはmode.enforceがtrueでverdictが無くwarningが無いか文字列のときだけdeferredとし、authorizeは承認要求を出さず警告だけ示す。形の崩れたdeferredは従来の無効な応答として承認を求め、バイナリが無い場合は委任しない（REQ-051、EX-125）。OpenCodeが確認を求める場合はその確認が残る（REQ-049、REQ-050、EX-124）。応答のJSONの具体形はREQ-061が実装担当に委ねており、A19として記録された。judged・shadow・unavailableの既存の形と分類を変えず、承認済み要求を変更しないため、missing_specをrecordedとしてnewとする。単体テスト（bun test tests/unit）とcargo testは成功した。host.test.tsの統合テストはOPENCODE_TEST_BINが必要なため本レビューでは実行していない。"
