    conclusion: new
    reason: >-
      Independently reviewed base 47b9f7f5b281e1829b6a3b3aa7b8db1834e7f20a against candidate 6d73984fa34ebc53972107d3b5390057175319de and computed mode-plus-blob and IR hashes directly from those Git snapshots.
      The caller explicitly reports user approval for the narrow REQ-001 exception, and decision A1 and A2 and the added requirement paragraph describe that same scope without widening it.
      Word.literal accepts only literal and quoted parts without glob expansion; Word.text is their quote-removed spelling. The guard therefore excludes exactly /dev/null, not resolved variables, substitutions, other devices, normalized path aliases or differently named symlinks.
      Redirect substitution scanning precedes the guard, while command-body scanning and truncate and dd extraction are unchanged. The change affects only effect-mode redirect extraction and leaves invocation collection intact.
      Three added analysis tests assert the absent truncate effect, retained dangerous bodies and substitutions, ordinary target truncation and exclusion boundaries. Two added real-binary hook tests assert REQ-022 allow output and retained deny output without mocks. No existing test expectations were weakened.
      Observed cargo test -p guardian-analysis --locked passing all 99 tests, cargo test -p command-guardian --locked --test hook passing all 14 tests, and cargo test --workspace --locked passing with no failures.
      No blocking implementation or specification finding was found for the pinned comparison. Full GNU and musl release gates and publication remain the caller and existing CI's responsibility.
    requirements: [REQ-001, REQ-022]
