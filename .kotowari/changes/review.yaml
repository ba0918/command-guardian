  reason: "hook::runは影実行の分岐（enforce=false）の後でだけdefers（defer_askかつ最終判定ask）を見るため、影実行が優先し（REQ-063、EX-130）、委任時はエージェントとpermission_modeに関係なく記録して何も出力せず0で終わる（REQ-060、REQ-062、EX-118、EX-119、EX-127）。blockと助言のblockはdefersに入らずdenyのまま（EX-120、EX-122）。JSONとして読めない入力とbuild_engine失敗は従来どおり判定前にreturnし記録もしない（EX-132、REQ-022、REQ-023）。checkの経路は変更されていない（EX-121）。記録はwrite_shadowと同じappendを通るため保存先とsymlink拒否と警告継続はREQ-019と同じである（EX-129）。記録行の印は承認済み要求が具体形を委ねており、6番目の欄deferredという選択をA18として実装担当が記録した。これはA10とREQ-062の委任の範囲内で、影実行の行は5欄のまま（EX-130のテスト）で既存要求を変えないため、missing_specをrecordedとして扱いnewとする。テストは実行時にXDG_CONFIG_HOMEとXDG_STATE_HOMEをフィクスチャへ向けている。"
