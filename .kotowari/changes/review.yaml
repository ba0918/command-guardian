  conclusion: new
  reason: >-
    比較基準ではREQ-052が接続・認証の失敗で実行を止め、自動接続は版2.0.21の相手だけを採用し、プラグインは版が2.0.21でなければ実行ごとに例外を出していた。これを差し替えるREQ-065、REQ-066、REQ-070と、改訂したREQ-052は基準に無く、利用者が決定A16〜A22で採ったため新しい選択である。 connection.tsは版の照合を外しPID・loopback・認証情報・リダイレクト拒否だけを残し（A17、EX-106）、未指定時の登録無し・検証失敗はabsent、明示設定の不完全・失敗はfailedとして自動接続へ切り替えない（REQ-052、REQ-065、A22）。 index.tsは読み込み時にshell.hook、permission.hook、permission.reply、tool.transform、location.directoryの有無を確かめ欠けた名前で失敗し（REQ-070、A20、EX-145）、ctx.app.versionの照合を消した（A16、EX-144）。 接続が無いときはcreate.beforeの実際の入力で判定してblockだけを拒否し、ask・判定不能・入力を確立できない場合はguardianの確認も停止も出さず（REQ-065、REQ-066、A2、A4、A21）、明示設定の失敗は読み込み時と実行ごとに警告する（A25）。接続がある経路は従来どおり（A7）。 既存試験の期待の変更はconnect()の戻り値の型の変更に伴うものだけで、拒否する入力の集合は変わっていない。setup.test.tsとconnection.test.tsの追加はこれらの要求の期待どおりである。 接続確認は読み込み時の1回だけで、その時に一時的に失敗すると以後のセッションは接続が無い扱いになるが、IRは再試行を求めておらず決定の範囲内と判断した。 host-process.tsはstdioのホストを止めるための試験補助の変更で、要求の意味に関わらない。
