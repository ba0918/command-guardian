  conclusion: new
  reason: >-
    比較基準2a0b77eにはmode.defer_askもdocs/ir/defer-ask.md（REQ-059〜REQ-064）も無く、REQ-022はaskを常にpermissionDecisionのaskとして返し、REQ-048〜REQ-050はOpenCodeのaskで常にguardian由来の承認要求を出すと定めていた。この範囲で利用者が決定A1〜A17を採り、実装担当が委ねられた範囲でA18、A19を決めてIRを追加・改訂したため、基準から見て新しい選択である。
    利用者設定のmode.defer_askを既定falseの真偽値として読み、プロジェクト設定の値は型の検証前に取り除いて警告し、利用者設定の不正値はファイル全体を不採用にする（REQ-059、REQ-013〜REQ-015、A3、A15）。
    Claude CodeとCodexのフックは影実行の分岐の後で、最終判定がaskのものだけを何も出力せず終了コード0で委ね、blockと助言のblockは拒否し、checkと判定に至らない入力の扱いは変えない（REQ-060、REQ-063、REQ-018、REQ-022、REQ-023、A1、A2、A4、A7、A8、A14、A16）。
    委任の記録は影ログと同じ保存先と検査を使い、6番目の欄deferredで見分け、保存失敗は警告にとどめる（REQ-062、REQ-019、A6、A10、A11、A18）。OpenCode用の応答はstatus deferredとし、保存失敗時はwarningを足す。プラグインは設定を読まず、この応答でだけguardian由来の承認要求を省き、判定を取得できない場合は従来どおり承認を求める（REQ-061、REQ-048〜REQ-051、A5、A12、A17、A19）。
    mode.enforceがfalseのときはdefer_askに関係なく影実行として応答し委任の記録を書かないことを、Claude CodeとOpenCodeのフックの実バイナリのテストで確かめた（REQ-063、REQ-048）。この記録は実装者の照合だけを示し、独立したレビューは主張しない。
