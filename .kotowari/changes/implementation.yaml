  conclusion: new
  reason: >-
    この4ファイルは両機能が共に変えたため一つにまとめた。比較基準2a0b77eの文書はstandaloneやリモートに明示の接続設定を求め、版2.0.21を確かめられなければ実行しないと案内し、askの委任の設定を持たなかった。いずれも基準に無い選択を記録した決定（standaloneのA8、A9、A16〜A30、ask委任のA1〜A19）に基づくため新しい選択とする。
    docs/opencode.mdとREADMEは、版ではなくプラグインが頼るフックと文脈のAPIの一覧を対応条件として示し、固定版は結合試験の環境としてだけ記す（REQ-057、REQ-070、A18、A19）。standaloneが接続設定なしで動くこと、blockだけを拒否して承認が要る実行はOpenCodeに委ねること、明示設定と作成の失敗で警告して委ねること、承認要求と切断が重なるときの扱いを書いた（REQ-065〜REQ-068、REQ-052、REQ-053、A9、A21〜A23、A27〜A29）。
    README、CHANGELOG、docs/opencode.mdには、mode.defer_askを推奨しない理由と危険、記録の印、委任時のOpenCodeの承認の扱いを書いた（REQ-064、REQ-061、A13）。CHANGELOGはUnreleasedの節だけに足した。
    host.test.tsは固定版のホストを隔離起動し、接続が無いときの判定と委任、明示設定と作成の失敗の警告、作成と切断の重なりを確かめる試験（REQ-058、REQ-069、A8、A26）と、委任の応答で承認要求を出さず記録に印を付けること、委任してもOpenCode自身の承認は保つこと、記録の失敗で警告して委任を保つことを確かめる試験（REQ-061、REQ-062）を足した。既存の試験の期待の変更は、作成失敗で止めずに委ねるREQ-067への改定に当たるものだけである。
    承認済み要求の意味は変えていない。この記録は実装者の照合だけを示し、独立したレビューは主張しない。
