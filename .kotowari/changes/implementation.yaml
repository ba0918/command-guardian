    conclusion: new
    reason: >-
      比較元10f104ffdd677f313140312db8b4c178e5378271から候補5c4fb5aaeaafc2a02464c3dbff235f372c02cadbまでを照合した。
      製品32ファイルと導入手順3ファイルの計35ファイルを対象とし、Gitの6文字mode、NUL、blobの順で全identityを再計算した。
      関連IR8ファイルの全バイトも再計算し、要求の定義と決定記録を照合した。
      前候補eaaf8088ceb1cc4115af996bb2986c8c0fc57cfeから選択対象で変わったのはeffects.rsとio_contract.rsである。
      変更されていない部分は自分の既存のコード追跡に基づく判断を、現在のバイト同一性と要求を再確認して使用した。
      元rework、状態修正、承認された契約、F3とF4をentry全体の判断に含め、過去のPASSを根拠にしない。
      以下の実行結果は呼出元の報告であり、本担当は製品試験・ビルド・kotowariゲートを実行していない。

      parserのlib.rs、normalize.rs、contract.rs、grammar.rsはREQ-038の回復後診断、REQ-039の算術添字深さ、
      REQ-037/041のプロセス置換の引数位置と本体保持に対応する。語数期待も位置保持の契約に合わせた修正である。
      judgeのclassify.rsとclassify/git_classify試験はREQ-003/005のnested TMPDIRルート保護と、
      REQ-004/007の末尾リンク自身を親作業ツリーで分類する修正に対応し、末尾slashのリンク先分類は維持する。
      policyのconfig.rs、evaluation.rsとevaluation試験は設定ルートの字句的dot/parent正規化と、
      REQ-005/006の保護ルート一致・許可ルート自身の通常分類に対応する。設定パス解決のscope A37を参照する。
      guard.rsとguards_shape/guards_flags試験はREQ-027/034の誤型verdict/examplesの規則単位無効化と、
      REQ-030のUnicode単文字flagのまとめ書き・equals・ddash境界に対応する。

      analysisのeffects.rsとextract/resolve試験はREQ-001/002/007/008/009/041に従って代入を値として保存し、
      使用時に相対パスを解決する。引用されたtilde・glob文字、展開後の末尾slash、供給元の子集合を保持する。
      find/xargsの固定対象を供給元集合と別に残し、mktemp dry-runを作成済みと認めない。
      subshell、未呼出関数、shell起動の状態を親と分離し、evalと確定literal loopの状態継続は維持する。
      事後照合の旧A1はfixes A1/A5によるfixedである。ifの各分岐と短絡右辺を独立したContextで読み、共通値だけを合流する。
      elseなしでは実行しない経路も含める。resolve試験は条件付き代入、cwd、共通値、未変更束縛、false &&とtrue ||を扱う。
      条件を実行して成否を選ばず、REQ-002の確定条件へ戻す。
      旧A2はfixes A2/A4によるfixedである。未知forは反復間状態が安定するまで本文の効果を収集し、ゼロ回も合流する。
      各回でcontrolを確認し、Invocationは初回だけ収集しcacheを共有する。固定二回で終わらない。
      resolve試験の変数2/4/8個の代入連鎖と後続反復の不確定対象に対応し、REQ-002/008/039を維持する。
      旧A3はfixes A3によるfixedである。execdirの固定相対対象をUnresolvedとして残し、絶対対象とChildrenは別々に保持する。
      extract試験は起点自身、複数起点、./、glob、変数経由を扱う。述語による対象確定は導入しない。

      F3は表示だけでなく分類対象を変えたspec_conflictであり、fixes A6によるfixedとして扱う。
      旧lookup_varはOSパスをto_string_lossyでStringへ変え、その値から分類対象を再生成していた。
      呼出元は0xffを含む保護cwdのrm $PWDについて旧バイナリのephemeral・allow・終了0と修正後のprotected・block・終了2を報告した。
      候補のValue::TextはOsStringであり、lookup_varはHOME/TMPDIR/PWDのOsStrを保存し、resolve_valueはOsStringで連結する。
      expand_tilde、resolve_text、clean_pathはPathとOsStrを使い、確定した分類対象をlossy文字列から作り直さない。
      tildeの特殊形を未解決にし、末尾slashを保持する。merge_stateもOS文字列の値を比較する。
      残るto_string_lossyはこの解決経路ではUnresolvedの診断文字列である。
      io_contractの非UTF-8試験はPWD/HOME/TMPDIR、suffix、代入、glob、tildeについてprotectedと終了2を要求する。
      REQ-002/005/006/014/017への修正であり、UTF-8本文の対応範囲やlossy表示の新規承認ではない。
      以前lossyを出力だけの範囲外事項として分けた判断は、この分類経路の退行には適用できなかった。

      F4はF3修正で生じた隠しファイルglobのbase退行であり、fixes A7によるspec_conflictのfixedとして追加する。
      前候補はglob直前のvaluable/.へPath::parentを直接使い、dotの成分正規化によってbaseをvaluableからcwdへずらした。
      tildeでもprefixを値へ変える段階で末尾dotが消え得るため、parent取得後だけの修正では足りない。
      候補は最初のGlobより前のpartsへ非空のPart::Quoted("*")を追加してprefix Wordを作り、その後でresolve_valueを呼ぶ。
      valuable/.*と~/valuable/.*はこの段階でdotをファイル名の断片として保持し、Path::parentがvaluableを返す。
      引用断片なので新しいGlobを導入せず、既存の値展開と生のOSパス保持を使う。
      通常globの末尾slash prefix、ファイル名prefix、root、引用tildeにも同じ方法を適用し、供給元を過小化しない。
      io_contractの追加試験は保護valuable内の.victimをfixtureにし、相対・絶対・PWD・tildeの隠しglobでprotectedと終了2を要求する。
      fixtureの内容不変更も確認する。呼出元は旧バイナリのephemeral・allow・終了0、修正後のprotected・block・終了2と、
      通常glob・引用tilde・rootの既存試験成功を報告した。本担当はコードと試験期待を追跡したが、その実行を再現していない。
      REQ-002/005/006/014に従う供給元同一性の修正であり、新しいglobの実行・列挙仕様ではない。
      前候補の適合判断をそのまま保持せず、退行とその修正を現在の比較へ含める。

      appのconfig_loader.rs、config_paths試験とtempfile dev依存はREQ-013の相対cwd上方探索とREQ-015のmetadataエラー警告に対応する。
      runtime/mod.rsとworker.rsは引用除去にも解析前の1MiB検査を適用し、部分read/writeで期限を再開しない。
      REQ-036/039とValidationSessionの累積判定予算なしの既存契約を維持する。
      config_loader.rsとapp_guards_only試験の診断付き設定例拒否はguard-example-diagnostics A1と追加REQ-034に対応する。
      旧A4はcontracts A1をrecordedとする。layers.rsは一般設定の誤型・誤値をguard個別検証前にErrとして返す。
      commandsとguard一覧自体はファイル全体拒否、個々のguardは規則単位無効化とする。
      layers試験はこの区別とcustom regex等の誤値を、app_config試験は不正層を捨て正常な他層を残す両方向を確認する。
      利用者が選んだ復旧単位をREQ-015へ反映した変更であり、壊れたファイルの正常部分は残さない。

      main.rsとio_contract試験の出力不能時の3、hook/helpの0、警告出力失敗で判定を中断しない扱いはREQ-017/044とscope A27、
      cli-language-help A4に対応する。main.rsとlanguage_help試験のtext配置はcheck-text-layout A1と追加REQ-011に対応する。
      JSON説明とhook理由の配置は維持する。log.rsとshadow試験の排他追記はREQ-019の1行1判定を保つ。
      Cargo.tomlのrustixはdescriptorを固定した取得に使用し、REQ-016の単一バイナリを変えない。
      旧A5はcontracts A2をrecordedとする。専用ディレクトリとログ末尾要素のリンク・非通常ログを拒否し、保存場所なしもErrにする。
      hook.rsは保存失敗をstderr警告にしてstdout空・終了0を維持する。
      shadow試験はリンク先内容・権限の不変更、保存不能、保存場所なし、警告と継続を確認する。
      更新REQ-018/019の例外であり、全親経路のsymlinkやhardlinkを拒否する保証ではない。

      旧A6はcontracts A3とREQ-046をrecordedとする。各パイプ段を親のcloneで読み、最終段だけ親と合流する。
      親を変更する場合としない場合で値が異なれば未解決とし、shellやlastpipeを推測して選ばない。
      resolve試験は両方向の値変更、lastpipeの綴り、shell内側、cwd、共通値、先行段の漏出防止を扱う。
      旧A7はcontracts A4をrecordedとする。main.rsは本文、解釈するオプション名、formatをUTF-8に限定し、cwdはOSパスで受理する。
      io_contract試験は非UTF-8 cwd受理と本文・formatの3拒否を確認する。更新REQ-017の入力境界であり、REQ-043やlossy表示の承認へ拡張しない。

      .ignore、AGENTS.md、PROJECT.mdはchange-conformance A1-A3に基づくローカル照合手順である。
      .ignoreは探索からworktreeと記録を外すだけで、Git追跡や機械照合の除外ではない。
      今回の範囲の旧A1-A7、F3、F4は既存要求への修正または利用者承認とIR反映で処置したと判断する。
      recordedの契約追加があるためentry全体はnewとし、fixed部分の要求と定義IRも含める。
      未変更のwhile等、hardlink、親経路全体のリンク、パス表示自体の評価は解消を主張しない。
      分類対象とglob供給元の同一性は範囲内として照合した。この記録は実装者の判断であり、自分の承認や独立レビューの代替ではない。
      呼出元から最終独立静的レビューのPASSが報告されているが、本記録はその評価を代筆しない。
