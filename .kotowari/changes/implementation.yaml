  conclusion: new
  reason: >-
    接続設定の配布時に必要だった手動の認証設定を、自身の管理サービスの登録確認で置き換える。
    通信前に登録PID・URL・認証情報とloopback HTTPを確認し、検証済み接続先を固定する。
    SDKのサーバー情報で自身のPIDと2.0.21を照合し、自動接続のリダイレクトを拒否する。
    discoverによる検証前の認証送信を避けるA3の具体化は、利用者が承認した修正範囲内である。
    明示設定を一つでも指定した場合は従来の接続だけを使い、自動接続へ切り替えない。
    承認経路が確定しない場合の未実行と、既存のallow・block・native承認を維持する。
    A2・A3の判断をREQ-052・REQ-057とEX-106からEX-110に反映した。
    導入手順は0.1.2と未公開版を区別し、本体と同版のプラグインを登録する範囲に留める。
    型検査、24件のunit試験、固定OpenCode 2.0.21と実バイナリによる12件の隔離連携試験は成功した。
    個人サービスの操作、モデル呼出し、WSL固有の観測、版更新とリリースは行っていない。
  requirements: [REQ-047, REQ-048, REQ-049, REQ-052, REQ-056, REQ-057, REQ-058]
