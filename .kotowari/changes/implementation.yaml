  conclusion: existing
  reason: >-
    GNUとmuslの配布試験が呼ぶpackage-release.shはBunによるOpenCode依存の解決を必要とするため、
    既存のBun 1.4.2準備とfrozen-lockfileによる依存取得を各matrixのRust試験より前へ移す。
    移動したsetup-bunのv2参照だけを解決済みcommitへ固定し、固定依存、試験とjobの構成は維持する。
    CIの実行順はPROJECT.mdの開発運用設定であり、製品要求を追加する変更ではない。
    配布試験の失敗表示に対象、fixture、終了状態、捕捉済み標準出力と標準エラーを加えるが、
    成功条件、checkout外での実行、Rust依存ライセンスの確認と要求マーカーは変更しない。
    REQ-016の単一実行ファイルとREQ-advisor-012の静的組込みの意味を維持し、製品コード、IR、決定には変更がない。
    Bunがあるがnode_modulesのない隔離sourceでは両targetの組立てが依存解決で失敗し、
    同じfrozen-lockfile準備後には成功した。既存GitHub失敗の最初の標準エラーは未確認であり、
    この再現を既存runの厳密な原因特定や独立レビューの完了とは扱わない。
  requirements:
  - REQ-016
  - REQ-advisor-012
