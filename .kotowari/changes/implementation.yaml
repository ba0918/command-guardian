    sha256: sha256:fb2bddcc63ba9e84ff80e9ec6aca3a7c2043aff7b377b4dfc094fcd014ada66e
  conclusion: new
  reason: >-
    比較元のREQ-065は、明示した接続が失敗したとき警告して接続が無いときの判定に従うことだけを定め、その後に接続を確かめ直すかを定めていなかった。
    実装は読み込み時に1回だけ接続し、失敗するとそのセッションの間ずっとguardianの承認を使えなかった。
    利用者の決定A5に従い、接続が失敗した状態では実行のたびにconnectで確かめ直し(打ち切りの1秒は既存のconnectの値)、
    つながればその実行から承認の経路(opencode.mdのREQ-050からREQ-052)を使い、つながらなければ従来どおり警告して委ねるようにした。
    同時の実行は1回の確かめ直しを共有し、つながった接続のイベントの通信が1本になるようにした。
    確かめ直しを待つ間に解除や取り消しがあれば、従来の解除と取り消しの確認(proceed)で起動しないようにし、block判定のコマンドが起動しないことをsetup.test.tsで確かめた。
    REQ-065の文とEX-156をdocs/ir/opencode-standalone.mdに加え、host.test.tsに読み込み時に失敗した接続先があとからつながると承認待ちになる実ホストの試験(EX-156)を加えた。
    setup.test.tsの擬似ホストは、shellフックの解除でハンドラを外すように実ホストへ合わせた。既存の試験の期待は弱めていない。
  requirements: [REQ-050, REQ-051, REQ-052, REQ-065]
  decisions:
