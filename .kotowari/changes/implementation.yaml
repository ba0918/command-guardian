    before: sha256:bb623f92a18ce97d16178fab235e9cc43a4b33515bdd329154592dbbe679f482
    after: sha256:876db65d33aa73dfd1da4338a7d9308566347ce0332ea767fa88e119bca089fd
  ir:
  - path: docs/ir/cli.md
    sha256: sha256:08e0a91764e937241e01001ca9188f2ed43510a67259f85ff87ade64cdaf2e88
  conclusion: new
  reason: >-
    比較元のIRには版を表示する入口が無く、トップレベルのヘルプも--versionを案内していなかった。
    利用者の決定A1とA2に従い、トップレベルの--versionと-Vで標準出力へ"command-guardian <版>"の1行を出し終了コード0で終える処理をsrc/main.rsに加えた。
    版はCARGO_PKG_VERSIONでCargo.tomlの[package].versionをそのまま使い、設定読込と標準入力の読取の前に分岐する。
    checkやhookの後ろの--versionは各入口へ渡るままにした。
    A3に従いトップレベルのヘルプのOptionsとExit codesに版の表示を加え、REQ-045の文に版の案内を足した。
    これらはREQ-071とEX-154、EX-155としてdocs/ir/cli.mdに加えた。
    tests/language_help.rsでは、ヘルプが版の案内を含むことの確認、壊れた設定と開いたままの標準入力でも版を出して終わること(EX-154)、
    hookとcheckの後ろの--versionが版の表示にならないこと(EX-155、REQ-071)の試験を加え、標準入力を待たないことの確認を補助関数へまとめた。
    既存の試験の期待は弱めていない。
  requirements: [REQ-045, REQ-071]
