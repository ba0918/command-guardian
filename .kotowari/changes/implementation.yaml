  conclusion: existing
  reason: >-
    利用者が承認した0.1.3の公開に向け、既存の自動接続を同版の本体とプラグインとして配布する。
    Cargo.tomlを版の正本として0.1.3へ更新し、Cargo.lockの本体版も一致させた。
    既存のUnreleased項目を日付付き見出しへ昇格し、0.1.2から0.1.3への比較リンクを追加した。
    両言語READMEと導入ガイドの版付き例を0.1.3へ揃え、自動接続を未公開扱いから変更した。
    公開するOpenCode V2の起動・登録コマンドは正式名のopencodeに揃えた。
    0.1.2の明示接続条件と初回プラグイン対応版、対応ホスト版2.0.21は維持する。
    RustとTypeScriptの製品コード、要求と決定の意味、CIの公開条件には変更を加えない。
    同版manifestは既存のpackage-release.shが正本から生成し、既存CIが全検査後にタグと成果物を公開する。
    版・lock・CHANGELOG見出しと比較リンクは機械的に一致を確認した。
    タグを先行作成せず、公開済みタグも再利用しない。最終HEADの照合と製品検査後にmainへ送出する。
  requirements: [REQ-025, REQ-052, REQ-056, REQ-057, REQ-058]
