  conclusion: existing
  reason: >-
    mainで照合済みのOpenCodeのstandalone対応とaskの委任を0.3.0として配布する準備で、製品の挙動は変えていない。
    版の正本Cargo.tomlを0.2.0から0.3.0へ上げ、Cargo.lockの本体版も一致させた。
    UnreleasedをCHANGELOGの日付付き0.3.0見出しへ昇格し、0.2.0から0.3.0への比較リンクを加えた。
    各項目は承認済み要求のとおりで、接続が無いときの判定と承認が要る実行の委任はREQ-065からREQ-069、
    版の確認をやめ頼るAPIを読み込み時に確かめることはREQ-070、mode.defer_askはREQ-059からREQ-064に対応する。
    BREAKINGの印は2項目に付けた。一つは接続設定なしで動く項目で、0.2.0では接続できないとき実行を止めていた(当時のREQ-052)が、
    0.3.0では接続が無いときblock以外をOpenCode自身の権限判断に委ねて実行が進む(REQ-065、REQ-066)ため。
    もう一つは明示の接続設定の失敗や承認要求を作れないときに実行を止めず警告して委ねる項目で、従来の停止から変わる(REQ-067)ため。
    どちらも承認済みの意味を利用者へ知らせるだけで要求を加えない。
    READMEとOpenCode導入ガイドのmiseとplugin addの版付き例、明示サーバーの登録例を0.3.0へ揃え、
    standaloneの説明をREQ-068の内容のまま「0.2.0より後」から「0.3.0から」へ言い換えた。
    docs/opencode.mdの同梱物で導入する節は、アーカイブ名、リリースへのリンク(releases/tag/v0.3.0)、
    他の版では0.3.0を置き換えるという案内をすべて0.3.0に揃え、手順の内容は変えていない。
    同版プラグインの登録と対応条件(REQ-056、REQ-057)、配布物の構成(REQ-025)は変えていない。
    タグは先行作成せず、既存CIが全検査後に公開する。
  requirements: [REQ-025, REQ-052, REQ-056, REQ-057, REQ-059, REQ-060, REQ-061, REQ-062, REQ-063, REQ-064, REQ-065, REQ-066, REQ-067, REQ-068, REQ-069, REQ-070]
