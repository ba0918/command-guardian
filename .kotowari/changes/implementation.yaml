  conclusion: new
  reason: >-
    比較基準2a0b77eにはdocs/ir/opencode-standalone.md（REQ-065〜REQ-069）もREQ-070も無く、REQ-052は接続・認証・承認要求の作成の失敗で実行を止め、自動接続は版2.0.21の相手だけを採用すると定めていた。この範囲で利用者が決定A16〜A30（A1、A3、A6、A10〜A15は差し替え済み）を採ってIRを追加・改訂したため、基準から見て新しい選択である。
    プラグインは版を照合せず、読み込み時に頼るフックと文脈のAPIの有無を確かめ、欠けた名前を示して読み込みを失敗させる（REQ-070、EX-144、EX-145、A16、A20）。自動接続はPID、loopback、認証情報、リダイレクト拒否だけで採否する（REQ-052、EX-106〜EX-108、A17）。
    接続が無いときと明示設定が失敗したときは、create.beforeが受け取る実際のshell、cwd、コマンドで判定してblockだけを拒否し、承認が要る実行はOpenCode自身の権限判断に委ね、明示設定の失敗は読み込み時と実行ごとに警告する（REQ-065、REQ-066、REQ-047、REQ-055、REQ-051、A2、A4、A21、A22、A25）。接続がある場合の経路は変えていない（A7）。
    承認要求を作れないときは警告して委ね、承認待ちは作成の応答を受け取った時点から始まり、作成中の切断後にaskの応答が届けば取りやめ、先に届いた拒否は守り、通信が終わった後はつなぎ直してから作成する（REQ-067、REQ-053、REQ-049、REQ-050、A23、A24、A27〜A29）。
    基準からの既存の試験の期待の変更は、作成失敗で止めずに委ねるというREQ-052からREQ-067への改定に当たるものだけである。この記録は実装者の照合だけを示し、独立したレビューは主張しない。
