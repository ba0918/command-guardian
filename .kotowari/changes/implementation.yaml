    sha256: sha256:bf5b31af0f93f704aab700b018242a739bcc97fdac98714d5bb574cdf59e814d
  conclusion: existing
  reason: >-
    プラグインはOpenCodeの版を照合せず、読み込み時にshell.hook、permission.hook、permission.reply、tool.transform、location.directoryの有無を確かめ、欠けた名前を示して失敗する(REQ-070、EX-144、EX-145)。自動接続は版を照合せずPID、loopback、認証情報、リダイレクト拒否の照合だけで採否する(REQ-052、EX-106〜EX-108)。
    connectの結果を接続済み、未指定で接続なし、明示設定の失敗に分けた。明示設定は読み込み時にserver.infoで接続と認証を確かめ、失敗しても自動接続へ切り替えず、読み込み時と実行ごとにconsole.warnで警告する(REQ-052、REQ-065、EX-089、EX-109、EX-135)。
    接続が無いときはツールの包みで判定せず、create.beforeが受け取る実際のshell、cwd、コマンドで判定し、blockだけを拒否してそれ以外は何も出さずに戻り、OpenCode自身の権限判断に委ねる。起動入力を確定できない場合も委ねる(REQ-065、REQ-066、REQ-047、EX-133、EX-134、EX-136、EX-137、EX-140、EX-141、EX-146)。接続がある場合の経路は変えていない(EX-138)。
    承認要求の作成が失敗したとき、作成の応答を受け取れなかったとき、作成の前にイベントの通信が止まっていたときはunavailableを返し、呼び出し側が実行ごとに警告して委ねる。承認待ちは作成の応答を受け取った時点から始まり、作成中の通信の終了では取りやめず、応答がaskならその時点で通信の終了を検知して取りやめる。承認待ちの後の通信の終了、中断、解除では従来どおり取りやめる(REQ-067、REQ-053、EX-147〜EX-149)。
    試験は固定版のホストをserve --stdioとserveで隔離起動し、偽のguardianとbridgeの評価フックで判定の入力、タイムアウト、作成の失敗を作る。既存の試験の期待を変えたのは、明示設定の失敗と作成失敗で止めないというREQ-052の改定に当たるものだけで、承認待ちの切断の単体試験は作成の応答を受け取ってから切断するよう同期だけを直した。
  requirements: [REQ-047, REQ-052, REQ-053, REQ-065, REQ-066, REQ-067, REQ-070]
