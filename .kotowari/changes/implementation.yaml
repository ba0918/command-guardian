  reason: >-
    導入手順からOpenCodeの版を対応の条件とする記述を外し、プラグインが頼るフックと文脈のAPIの一覧、読み込み失敗後の扱いと他のプラグインのevaluateフックによる上書きを保証しないことを書いた。固定版2.0.21は結合試験の環境としてだけ記す(REQ-057、REQ-070)。
    opencode run --standaloneが接続設定なしで動くこと、接続が無いときはblockだけを拒否し、guardianの承認が要る実行にguardianの確認を出さずOpenCode自身の権限判断に委ねること、明示設定の失敗と承認要求の作成失敗では警告して委ねることを新しい節に書き、standaloneに明示の接続設定を求める案内を消した(REQ-068、REQ-065〜REQ-067)。検証の範囲にserve --stdioの結合試験と通し実行をしないことを足した(REQ-058、REQ-069)。
    既存の見出しは変えず、site/build.pyの生成が成功することを確かめた。CHANGELOGはUnreleasedの節だけに足した。README-ja.mdも同じ内容に改めたが、変更照合の対象の外である。
