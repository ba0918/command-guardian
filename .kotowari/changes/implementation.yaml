  conclusion: new
  reason: >-
    比較基準の文書はstandalone、リモート、明示起動のサーバーに接続オプションを求め、自身の管理サービスの版2.0.21を確かめられなければ実行しないと案内していた。この前提を決定A9、A18、A19、A30で改め、基準の仕様と食い違う委任の扱い(A21〜A23)と、基準に無かったAPI確認と作成・切断の重なりの扱い(A20、A27〜A29)を記録したため、結論を新しい選択とする。
    導入手順からOpenCodeの版を対応の条件とする記述を外し、プラグインが頼るフックと文脈のAPIの一覧、読み込み失敗後の扱いと他のプラグインのevaluateフックによる上書きを保証しないことを書いた。固定版2.0.21は結合試験の環境としてだけ記す(REQ-057、REQ-070)。
    opencode run --standaloneが接続設定なしで動くこと、接続が無いときはblockだけを拒否し、guardianの承認が要る実行にguardianの確認を出さずOpenCode自身の権限判断に委ねること、明示設定の失敗と承認要求の作成失敗では警告して委ねることを新しい節に書き、standaloneに明示の接続設定を求める案内を消した(REQ-068、REQ-065〜REQ-067)。検証の範囲にserve --stdioの結合試験と通し実行をしないことを足した(REQ-058、REQ-069)。
    承認の振る舞いの節に、作成の応答より前に届いた拒否は作成が失敗しても守ること、作成中に通信が切れた後に応答が承認待ちを示せば取りやめること、通信が終わった後はつなぎ直してから承認要求を作り、つなぎ直せなければ警告して委ねること、再接続でも取りやめた実行を再開しないことを書いた(REQ-067、REQ-053、A27〜A29)。
    既存の見出しは変えず、site/build.pyの生成が成功することを確かめた。CHANGELOGはUnreleasedの節だけに足した。README-ja.mdも同じ内容に改めた。README-ja.mdと紹介ページsite/template.html(A30で版ではなくプラグインAPIを対応条件とする記述に改めた)は変更照合の対象の外である。
