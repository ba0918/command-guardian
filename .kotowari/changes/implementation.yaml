  conclusion: new
  reason: >-
    呼出元が固定したorigin/mainの比較元から統合候補全体を照合し、変更ファイルのGit modeとblob、関連IRの全bytesを再取得した。
    助言層の実装と試験はREQ-advisor-001から021と列挙した既存要求を対象とする。
    offと機械blockでは追加取得とモデル実行を行わず、observeでは機械結果を維持し、enforceでも機械blockを解除しない。
    危険性と指示範囲の分布検証、候補合成、利用者だけの設定、送信本文検査、限定文脈と安全保存、単一期限と専用子、既存CLIと三ホストの出口の契約を維持する。
    質問の分類と指示の鮮度の意味の検証分担は利用者が承認したA63/A64と計画A7/A8による改訂を含むためnewとする。
    構造試験の成功を質問の意味、実モデル精度、現在のTypeSafeサービスとの適合の証明とは扱わない。
    検証文書とfixtureは対応版と取得境界、実測値と未評価の範囲を記録し、公開APIや対応ホストの保証を拡張しない。
    README、CHANGELOG、PROJECT、OpenCode導入文書とTODOは既存要求と実装済み範囲、外部送信とログの注意、未評価事項を説明する変更であり、新たな製品の意味を採用するものではない。
    完了した実装計画はGit履歴へ委ね、決定記録の参照は固定コミットの計画へ向ける。承認済み要求と決定の意味は変更しない。
    並行した紹介ページのbuild.py、style.css、template.htmlは比較元のblobをそのまま保ち、製品コード、IR、決定、文書の内容は統合前のローカル候補から変更していない。
    この記録は統合後の実装者照合だけを示す。保存した旧review.yamlは比較元が異なる暫定記録であり、独立担当による再照合と最終HEADのreview検査、製品チェック、pushの成功は主張しない。
