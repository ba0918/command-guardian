    sha256: sha256:fb2bddcc63ba9e84ff80e9ec6aca3a7c2043aff7b377b4dfc094fcd014ada66e
  conclusion: new
  reason: >-
    利用者の決定A4に従い、版の表示と0.3.0の残件の対応をまとめて0.3.1として配布する準備をした。
    版の正本Cargo.tomlを0.3.0から0.3.1へ上げ(Cargo.lockの本体版も一致させた。Cargo.lockは照合の対象外)、
    CHANGELOGに日付付きの0.3.1見出しと0.3.0から0.3.1への比較リンクを加えた。
    各項目は今回加えた要求のとおりで、版の表示はREQ-071、明示した接続の確かめ直しはREQ-065(A5)、
    作れなかった承認要求に拒否の返答を送らないことはREQ-067(A6、A9)に対応する。いずれも挙動の追加か、利用者を巻き込みうる拒否をやめる修正で、BREAKINGの印は付けない。
    READMEとdocs/opencode.mdのmiseとplugin addの版付き例、明示サーバーの登録例、同梱物のアーカイブ名とリリースへのリンクを0.3.1へ揃えた。
    docs/opencode.mdの接続なしの節には、明示した接続が失敗している間は実行ごとに1秒で打ち切って確かめ直し、つながればその実行から承認を使うことをREQ-065のとおりに書いた。
    導入手順が自動接続と明示の接続・認証設定を示すこと(REQ-057)、自動接続でも明示設定と同じく働くこと(EX-106)、明示設定でその接続で承認要求を作ること(EX-088)は、
    FLAG-002で出典が置き換えられた決定にしか無かったため、利用者の決定A8で現行の決まりとして確認し、REQ-057、EX-106、EX-088の出典に加えてFLAG-002を閉じた。意味と文書の内容は変えていない。
    配布物の構成(REQ-025)と同版プラグインの登録(REQ-056)は変えていない。タグは先行作成せず、既存CIが全検査後に公開する。
