- id: opencode-no-reject-reply-implementation
  base: e4695e8f9e257303adca961bd1c51f2d1f5ee8cf
  role: implementer
  files:
  - path: plugins/opencode/src/approval.ts
    before: sha256:8efc2ab3e28f23b91db73e70b14fdf6b30b7befa790b219fde033cd2f660aac3
    after: sha256:b46c47a9ab482f245236b1e239dbfa6b05b751edda8dfb6c0d6948ac13a1704a
  - path: plugins/opencode/tests/unit/approval.test.ts
    before: sha256:ae1a00f6f6a52b9bbcddc3fa612ccd6aab8666863f8dfc1e1c7c7947eff6f51b
    after: sha256:346f2435690375ab0dd3e479a0272d5bb1c4e8fb6b6ae367cec6382591d1e923
  ir:
  - path: docs/ir/opencode-standalone.md
    sha256: sha256:f851d4a039bf4038f90243fce5035eac6640879cb81c0e62772208f8088ff1cb
  conclusion: new
  reason: >-
    比較元のREQ-067は、承認要求を作れなかったものとして扱いOpenCodeに委ねるときに、その要求へ拒否の返答を送るかを定めていなかった。
    実装は送っており、作成が実は成功していた場合に同じセッションの他の承認待ちまで拒否しうる。
    利用者の決定A6とA9に従い、approval.tsで作れなかったものとして扱い委ねる経路の拒否の返答だけをやめた。
    作成の応答より前に利用者の拒否が届いていた要求と、作成中に取り消された要求の拒否の返答は従来どおり残している(その手前の分岐で例外として扱われ、この変更の経路に入らない)。
    REQ-067の文とEX-157をdocs/ir/opencode-standalone.mdに加え、approval.test.tsに拒否の返答が送られず他の承認待ちが返答を待ち続ける試験(EX-157)を加えた。
    EX-153の試験はつなぎ直しの回数を2回に固定していたが、REQ-067は回数を定めておらず、A7に従い「つなぎ直しを試みた」(1回より多い)へ緩めた。
    これは仕様に無い値を試験が固定していたことの是正で、要求の意味は変えていない。
  requirements: [REQ-067]
