    conclusion: deferred
    reason: >-
      比較元10f104ffdd677f313140312db8b4c178e5378271から、選択対象の製品31ファイルと
      導入手順3ファイルを照合した。ハッシュは候補21d0516865a95b7e53f8aadcce1876ed150ac1fdの
      Git mode、NUL、blobから算出した。製品はcf2117167ff42533c647b86e50426df6eef5adaaと同じ。
      前回の製品32ファイルという集計を31へ訂正する。過去のPASSと試験成功の記述は適合の根拠にしない。
      本担当は差分とIRを静的に照合し、製品の実行・試験・独立レビュー承認は行っていない。

      parserのlib.rs、normalize.rs、contract.rs、grammar.rsは、回復後も構文失敗を残すREQ-038、
      算術添字の深さを数えるREQ-039、プロセス置換の語位置と本体を保つREQ-037/041の修正に対応する。
      judgeのclassify.rsと二つの分類試験は、nested TMPDIRルートを配下許可より先に保護するREQ-003/005と、
      末尾リンクを親作業ツリーで分類するREQ-004/007に対応する。公開する設定探索の意味は変えていない。
      policyのconfig.rs、evaluation.rsとevaluation試験は、設定ルートの字句的なdot/parent正規化と、
      許可ルートそれ自体を通常分類へ戻すREQ-005/006および設定パス解決のA37に対応する。
      guard.rsとguards_shape/guards_flags試験の誤型verdict/examples拒否とUnicode単文字flag照合は
      REQ-027/030/034の修正に対応するが、一般セクションの部分受理とは区別する。

      appのconfig_loader.rs、config_paths試験とtempfileのdev依存は、相対cwdの上方探索REQ-013と
      user設定metadataエラーの警告REQ-015に対応する。runtime/mod.rsとworker.rsは、引用除去にも
      解析前の1MiB検査を適用し、部分read/writeで期限を再開しないREQ-036/039の修正である。
      ValidationSessionへ累積判定予算を追加していない。診断付き設定例を当該規則だけ無効化する
      config_loader.rsとapp_guards_only試験は、2026-10-02-guard-example-diagnostics A1とREQ-034への
      明示的追加に対応する新規受理条件であり、旧IRだけから導いたとは記録しない。

      analysisのeffects.rs、extract/resolve試験の文字列代入保持と使用時の相対解決、引用されたtildeとglob、
      展開後の末尾slash、glob供給元の子集合、find/xargs固定絶対対象、mktemp dry-run除外は
      REQ-001/002/007/008/009/041に対応する。ただし同じファイルのloop状態とexecdir処理には下記の未解決がある。
      main.rs、hook.rs、io_contract試験のpanic回避、check出力不能時の3、hookの0、helpの0は
      REQ-017/044とscope A27、cli-language-help A4に対応するが、UTF-8受理範囲の選択は別の穴である。
      main.rsとlanguage_help試験の判定・説明先頭行の同一行化は、check-text-layout A1と追加REQ-011に対応する。
      src/log.rs、shadow試験の排他追記はREQ-019の1行1判定の修正。Cargo.tomlのrustixは安全取得に使われ、
      配布する別バイナリを追加しない。ただし保存先拒否と失敗時の記録省略は未定義の受理条件として残る。

      A1はspec_conflictとして保留する。effects.rs:298-310はif全分岐を同じContextへ反映し、388-399は
      loop後に親へ書き戻すため、false分岐内の代入を確定したパスにする。REQ-002の確定値条件に反する。
      resolve試験の無条件loop伝播だけではこの経路を検証していない。親の実バイナリ観測は決定記録にあり、
      本担当の独立根拠はコードの状態伝播である。既存REQ-002を保った不確定状態の修正が必要である。
      A2もspec_conflictとして保留する。effects.rs:381-399はGlobをChildrenとしてresolvedへ入れるが
      all_literalをfalseにせず、一回だけbodyを解析してcwdとvarsを親へ確定伝播する。
      resolve試験の子集合期待は反復回数によるcwdの不確定性を扱わない。未知の反復後の値を
      確定したパスとして扱うことはREQ-002から導けず、供給元分類REQ-008はそれを許可しない。
      A3もspec_conflictとして保留する。effects.rs:893-902,990-1003はexecdirの固定相対対象を
      parent成分がなければ出力せず、932-947は起点のChildrenだけを追加する。
      起点自身の訪問で起点の親にある固定対象まで子集合に吸収できない。
      extract試験の-type fの場合と固定絶対対象の場合だけでは起点自身のケースを閉じられない。
      REQ-001/002/008と衝突し、起点自身を含む対応条件の判断と対象の保持または未解決化が必要である。

      A4はspec_conflictとして保留する。layers.rs:33-83とguard.rsの誤型commands処理は警告後も
      正常部分を残す。新規layers試験はenforce=falseやgit.enabled=falseの保持を明示的に固定する。
      REQ-015とscope A5の組み込み既定復帰を、REQ-034のguard規則単位無効化から一般化できない。
      部分受理のコードが以前からあっても、この新規期待値を既存要求の修正として承認しない。
      設定層を既定に戻す修正か、復旧単位について利用者が承認した要求改訂が必要である。
      A5はmissing_specとして保留する。log.rs:41-63のリンク・非通常ファイル拒否とhook.rsの
      write_shadow失敗の破棄、shadow試験の無出力・0継続を確認した。REQ-018/019には記録省略条件がない。
      リンク先を変更する旧動作へ戻さず、拒否条件と警告を含む保存不能時の契約を利用者に引き渡す。
      全パスのリンクやhardlinkを防ぐ保証、無期限lock待ちの応答時間適合は本記録で承認しない。
      A6はmissing_specとして保留する。effects.rs:238-245は複数段の全段を親Contextのcloneで読む。
      resolve試験は通常パイプの漏出防止だけを固定し、REQ-001/002/035はlastpipe等の実行モードの
      適用前提を明示していない。通常bashの修正と、最終段が親状態を変えるモードの扱いを分けて判断する。
      モード別の実害は本担当では未検証であり、通常bashの漏出防止自体を仕様違反とは断定しない。
      A7はmissing_specとして保留する。main.rs:127-165は本文とオプション名・formatをUTF-8に限り、
      cwdだけOsStringからPathBufへ渡す。io_contract.rs:15-45は非UTF-8 cwd受理と本文の3拒否を固定する。
      REQ-017の失敗時終了コードはこの対応範囲を選ぶ根拠にはならず、REQ-043の元データ保持とも
      区別して受理境界の決定とIR明記を利用者へ引き渡す。lossyなパス変換を承認したとは扱わない。

      .ignore、AGENTS.md、PROJECT.mdの差分は、change-conformance A1-A3に基づく対象列挙、
      独立記録、ブランチ全体の照合、根拠と承認範囲の境界という開発時手順である。
      ignoreは探索から記録とworktreeを外すだけで、Git追跡と機械照合から除外する意味ではない。
      製品の受理条件を追加する根拠には使わない。A1-A7の引渡し記録は判断の保留を支持するデータであり、
      実装を承認する根拠ではない。A8に従いentry全体をdeferredとし、独立レビューと修正後の再照合へ返す。
      この記録の形式・ハッシュ・網羅性の確認は統合ゲート通過や自己承認ではない。
