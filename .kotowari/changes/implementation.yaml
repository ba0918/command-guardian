  reason: >-
    比較基準の時点ではREQ-065〜REQ-070とdocs/ir/opencode-standalone.mdは無く、REQ-052は接続・認証・承認要求の作成の失敗で実行を止め、自動接続で版2.0.21だけを受け入れると定めていた。この範囲で決定A16〜A29を採ってIRを追加・改訂したため、基準から見て既存の要求の内側ではなく新しい選択である。基準のREQ-052と版の照合を覆す選択(A16、A17、A21〜A24、A29)と、基準が定めていなかった読み込み時のAPI確認、警告の出し先、作成と切断の重なり(A20、A25〜A28)を仕様の欠落として記録した。
    プラグインはOpenCodeの版を照合せず、読み込み時にshell.hook、permission.hook、permission.reply、tool.transform、location.directoryの有無を確かめ、欠けた名前を示して失敗する(REQ-070、EX-144、EX-145)。自動接続は版を照合せずPID、loopback、認証情報、リダイレクト拒否の照合だけで採否する(REQ-052、EX-106〜EX-108)。
    connectの結果を接続済み、未指定で接続なし、明示設定の失敗に分けた。明示設定は読み込み時にserver.infoで接続と認証を確かめ、失敗しても自動接続へ切り替えず、読み込み時と実行ごとにconsole.warnで警告する(REQ-052、REQ-065、EX-089、EX-109、EX-135)。
    接続が無いときはツールの包みで判定せず、create.beforeが受け取る実際のshell、cwd、コマンドで判定し、blockだけを拒否してそれ以外は何も出さずに戻り、OpenCode自身の権限判断に委ねる。起動入力を確定できない場合も委ねる(REQ-065、REQ-066、REQ-047、EX-133、EX-134、EX-136、EX-137、EX-140、EX-141、EX-146)。接続がある場合の経路は変えていない(EX-138)。
    承認要求の作成が失敗したとき、作成の応答を受け取れなかったときはunavailableを返し、呼び出し側が実行ごとに警告して委ねる。承認待ちは作成の応答を受け取った時点から始まり、作成中の通信の終了だけでは取りやめない(REQ-067、EX-147、EX-149)。
    イベントの通信を接続ごとの単位に分け、各承認要求は作成時の接続を持つ。作成中にその接続が切れて応答がaskで届いた場合は、別の接続へつなぎ直した後でも取りやめ、委ねない(A27、EX-150)。作成の応答より前に届いた拒否の返答は覚えておき、その後に作成が失敗しても拒否として扱う(A28、EX-151)。通信が終わった後に承認要求が要る実行が来たときは新しい接続でつなぎ直してから作成し、つなぎ直せなければunavailableを返して委ねる(A29、EX-152、EX-153)。承認待ちの後の通信の終了、中断、解除では従来どおり取りやめ、後の承認や再接続でも再開しない(REQ-053、EX-148)。
    試験は固定版のホストをserve --stdioとserveで隔離起動し、偽のguardianとbridgeの評価フックで判定の入力、タイムアウト、作成の失敗を作る。基準からの既存の試験の期待の変更は、作成失敗で止めずに委ねるというREQ-052からREQ-067への改定に当たるものだけで、承認待ちの切断の単体試験は作成の応答を受け取ってから切断するよう同期を直し、EX-148の印を足した。単体試験の器具はつなぎ直しごとに新しい通信を作るよう改めた。頼るAPIが無いときの試験(EX-145)は、読み込みの失敗と欠けたAPIの名前を含むことだけを確かめる。
