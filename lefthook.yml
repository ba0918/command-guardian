# Git フック（lefthook）。クローンごとに一度 `lefthook install` で有効にする。
pre-commit:
  piped: true
  commands:
    fmt:
      priority: 1
      glob: "*.rs"
      run: cargo fmt --all --check
    lint:
      priority: 2
      glob: "*.{rs,toml}"
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    test:
      priority: 3
      glob: "*.{rs,toml}"
      run: cargo test --workspace --locked
    kotowari:
      priority: 4
      glob: "*.{rs,md,yaml}"
      run: scripts/kotowari-check.sh
