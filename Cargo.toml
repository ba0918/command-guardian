[workspace]
members = [
    "crates/guardian-analysis",
    "crates/guardian-core",
    "crates/guardian-judge",
    "crates/guardian-parser",
    "crates/guardian-policy",
]
resolver = "2"

[package]
name = "command-guardian"
version = "0.1.0"
edition = "2021"
description = "危険な Bash コマンドをパスの意味論で判定するフック"
license = "MIT"

[[bin]]
name = "command-guardian"
path = "src/main.rs"

[dependencies]
guardian-core = { path = "crates/guardian-core" }
guardian-judge = { path = "crates/guardian-judge" }
guardian-parser = { path = "crates/guardian-parser" }
guardian-policy = { path = "crates/guardian-policy" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[workspace.dependencies]
brush-parser = "=0.4.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tempfile = "3"
